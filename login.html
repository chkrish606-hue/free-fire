<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KP Panel Shop - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: #0d0f17;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .auth-card {
            background: #131622;
            border: 1px solid #1f2438;
            border-radius: 16px;
            padding: 30px 24px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 0 25px rgba(138, 43, 226, 0.2);
        }

        .logo-box {
            width: 110px;
            height: 110px;
            margin: 0 auto 15px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0,212,255,0.2) 0%, rgba(138,43,226,0.4) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #8a2be2;
            box-shadow: 0 0 15px #8a2be2;
        }

        .logo-box img {
            width: 90px;
            height: 90px;
            border-radius: 50%;
        }

        .title {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .title span {
            color: #00d4ff;
        }

        .subtitle {
            font-size: 11px;
            color: #a0a5b8;
            letter-spacing: 0.5px;
            margin-bottom: 25px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 11px;
            color: #8a90a6;
            margin-bottom: 6px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            background: #090b11;
            border: 1px solid #23283b;
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        .form-group input:focus {
            border-color: #8a2be2;
            box-shadow: 0 0 8px rgba(138, 43, 226, 0.4);
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, #6a11cb 0%, #2575fc 100%);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 1px;
            cursor: pointer;
            margin-top: 8px;
            margin-bottom: 12px;
            box-shadow: 0 4px 15px rgba(37, 117, 252, 0.3);
        }

        .btn-google {
            width: 100%;
            padding: 12px;
            background: #1a1e2d;
            border: 1px solid #2d344b;
            border-radius: 10px;
            color: #fff;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 14px;
        }

        .btn-secondary {
            width: 100%;
            padding: 12px;
            background: transparent;
            border: 1px solid #3b2667;
            border-radius: 10px;
            color: #b197fc;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="logo-box">
            <img src="logo.png" alt="KP Panel Logo">
        </div>
        <div class="title">KP PANEL <span>SHOP</span></div>
        <div class="subtitle">KP PANEL MEANS THE HARDCORE LAYER OF TRUST</div>

        <form action="dashboard.html" method="GET">
            <div class="form-group">
                <label>USERNAME OR EMAIL</label>
                <input type="text" placeholder="Enter your username or email" required>
            </div>

            <div class="form-group">
                <label>PASSWORD</label>
                <input type="password" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="btn-primary">SIGN IN NOW</button>
            
            <button type="button" class="btn-google">
                <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.2 9 5 12 5z"/><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/><path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.9 7.3C.7 9.7 0 12 0 12s.7 2.3 1.9 4.7l3.7-1.9z"/><path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.2-6.4-5.2L1.9 16C3.7 19.7 7.5 23 12 23z"/></svg>
                Sign in with Google
            </button>

            <a href="signup.html" class="btn-secondary">CREATE NEW ACCOUNT</a>
        </form>
    </div>

</body>
</html>
