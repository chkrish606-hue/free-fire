<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KP Panel Shop - Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: #0b0d14;
            color: #ffffff;
            padding-bottom: 70px;
        }

        .header {
            background: #121522;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1e2335;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-btn {
            background: #1c2237;
            border: 1px solid #2e3754;
            color: #00d4ff;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .topup-btn {
            background: #00b4d8;
            color: #fff;
            border: none;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
        }

        .container {
            padding: 16px;
            max-width: 500px;
            margin: 0 auto;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }

        .stat-card {
            background: #131726;
            border: 1px solid #1f263e;
            border-radius: 10px;
            padding: 12px;
        }

        .stat-label {
            font-size: 10px;
            color: #8c93ad;
            margin-bottom: 4px;
            font-weight: 600;
        }

        .stat-val {
            font-size: 16px;
            font-weight: 800;
            color: #38ef7d;
        }

        .category-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            margin-bottom: 20px;
            padding-bottom: 4px;
        }

        .cat-chip {
            background: #181d2e;
            border: 1px solid #28314d;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 11px;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .cat-chip.active {
            background: #2b1f4d;
            border-color: #8a2be2;
            color: #c499ff;
        }

        .product-card {
            background: #131726;
            border: 1px solid #202740;
            border-radius: 14px;
            overflow: hidden;
            margin-bottom: 16px;
        }

        .product-img {
            width: 100%;
            height: 180px;
            background: #000;
            object-fit: cover;
        }

        .product-body {
            padding: 14px;
        }

        .product-title {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .plans-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 12px;
        }

        .plan-item {
            background: #0c0f1a;
            border: 1px solid #1e253b;
            padding: 10px 12px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .plan-price {
            font-size: 13px;
            font-weight: 700;
            color: #00d4ff;
        }

        .qty-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .qty-btn {
            background: #252d47;
            border: none;
            color: #fff;
            width: 24px;
            height: 24px;
            border-radius: 4px;
            font-weight: 700;
            cursor: pointer;
        }

        .buy-btn {
            background: #8a2be2;
            color: #fff;
            border: none;
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
        }

        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #0f121d;
            border-top: 1px solid #1a2033;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
        }

        .nav-item {
            color: #6c7592;
            font-size: 10px;
            text-align: center;
            text-decoration: none;
        }

        .nav-item.active {
            color: #00d4ff;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-btn">🌐 STORE</div>
        <div class="header-btn">₹35.00</div>
        <button class="topup-btn">+ TOP UP</button>
    </div>

    <div class="container">
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">WALLET BALANCE</div>
                <div class="stat-val">₹35.00</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">KEYS PURCHASED</div>
                <div class="stat-val" style="color:#00d4ff;">22</div>
            </div>
        </div>

        <div class="category-scroll">
            <div class="cat-chip active">⚡ All Products (18)</div>
            <div class="cat-chip">⚡ Android Non Root (10)</div>
            <div class="cat-chip">⚡ Apple iOS Product (4)</div>
        </div>

        <div class="product-card">
            <img src="banner.jpg" class="product-img" alt="Product Banner">
            <div class="product-body">
                <div class="product-title">🔥 BALA MOD PRO ANDROID NON ROOT</div>
                
                <div class="plans-list">
                    <div class="plan-item">
                        <div>
                            <div style="font-size:12px; font-weight:600;">1 Hours</div>
                            <div class="plan-price">₹8.00</div>
                        </div>
                        <div class="qty-controls">
                            <button class="qty-btn">-</button>
                            <span style="font-size:12px;">1</span>
                            <button class="qty-btn">+</button>
                            <button class="buy-btn">GET</button>
                        </div>
                    </div>

                    <div class="plan-item">
                        <div>
                            <div style="font-size:12px; font-weight:600;">2 Hours</div>
                            <div class="plan-price">₹16.00</div>
                        </div>
                        <div class="qty-controls">
                            <button class="qty-btn">-</button>
                            <span style="font-size:12px;">1</span>
                            <button class="qty-btn">+</button>
                            <button class="buy-btn">GET</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="nav-bar">
        <a href="#" class="nav-item active">🏪<br>Store</a>
        <a href="#" class="nav-item">🔑<br>My Keys</a>
        <a href="#" class="nav-item">💳<br>Deposit</a>
        <a href="#" class="nav-item">📜<br>History</a>
        <a href="#" class="nav-item">👤<br>Profile</a>
    </div>

</body>
</html>
